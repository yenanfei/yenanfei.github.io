name: Update Google Scholar stats

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch citation stats
        run: python scripts/update_scholar.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contents/scholar.json
          if git diff --cached --quiet; then
            echo "No citation changes"
            exit 0
          fi
          git commit -m "chore: update Google Scholar citation stats"
          git push
